<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Code 能力总览</title>
<!-- 必须内联：主题要在首次绘制前定下来，否则深色模式会闪白 -->
<script>
try{
  var t = localStorage.getItem("cccap-theme") ||
          (window.matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", t);
}catch(e){}
</script>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">
  <aside class="rail" id="rail">
    <div class="brand">Claude Code 能力总览<small>本机配置 · 2026-10-13</small></div>

    <div class="searchbox">
      <svg class="mag" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜索能力、子代理、命令…" autocomplete="off" aria-label="搜索">
      <kbd>⌘K</kbd>
    </div>

    <div class="chips" id="chips" role="group" aria-label="按分类筛选"></div>

    <div class="foldall">
      <button id="foldall" type="button">全部折叠</button>
      <button id="unfoldall" type="button">全部展开</button>
    </div>

    <nav id="nav" aria-label="章节目录"></nav>

    <div class="railfoot">
      已启用 <b><span data-stat="plugins"></span></b> 个插件<br>
      <b><span data-stat="skills"></span></b> 技能　<b><span data-stat="agents"></span></b> 子代理<br>
      <b><span data-stat="mcp"></span></b> 个 MCP 服务器
      <button class="themebtn" id="themebtn" aria-label="切换深浅色">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="themelabel">深色</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <p class="lede">本机已启用 <b><span data-stat="plugins"></span> 个插件</b>、<b><span data-stat="skills"></span> 个技能</b>、<b><span data-stat="agents"></span> 个子代理</b>、<b><span data-stat="mcp"></span> 个 MCP 服务器</b>。左侧搜索框是主要入口——直接搜「关键词」即可定位到具体工具。</p>

    <div id="doc"></div>
    <div id="results" aria-live="polite"></div>
  </main>
</div>

<button class="railtoggle" id="railtoggle" aria-expanded="false">目录</button>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
