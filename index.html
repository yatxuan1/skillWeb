<title>Claude Code 能力总览</title>

<style>
:root{
  --paper:#FCFCFA; --ink:#15171C; --muted:#6D7480;
  --rule:#E4E6EA; --rule-soft:#EFF1F3;
  --accent:#4B3F72; --accent-soft:#ECE9F3; --accent-fg:#FFFFFF;
  --mark:#F6E7BE; --code-bg:#F3F4F6; --code-fg:#242A33;
  --nav-fg:#3A4049; --nav-n:#A6ACB6; --hover-bg:#FAFAF9;
  --note-bg:#F7F7F5; --note-fg:#4A5058;
  --id-line:#D6DAE0; --id-hover:#E7EAEE;
  --input-bg:#FFFFFF; --placeholder:#A6ACB6; --dot:#C3C8D0;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --serif:"Songti SC","Noto Serif SC",Charter,Georgia,serif;
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
html[data-theme="dark"]{
  --paper:#131519; --ink:#E4E6EA; --muted:#8B93A0;
  --rule:#272B32; --rule-soft:#1D2128;
  --accent:#A99BD8; --accent-soft:#241F33; --accent-fg:#1B1726;
  --mark:#6A5420; --code-bg:#1E222A; --code-fg:#D5D9E0;
  --nav-fg:#B8BFC9; --nav-n:#6B7280; --hover-bg:#1B1F26;
  --note-bg:#1B1F26; --note-fg:#A8AFBA;
  --id-line:#333941; --id-hover:#252A32;
  --input-bg:#191D24; --placeholder:#6B7280; --dot:#3E444D;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:400 16px/1.75 var(--sans);
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

.wrap{display:grid;grid-template-columns:272px minmax(0,1fr)}

/* ---------- 左侧脊 ---------- */
.rail{
  position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;
  border-right:1px solid var(--rule);
  padding:20px 16px 40px;display:flex;flex-direction:column;gap:18px;
}
.brand{font:600 15px/1.4 var(--sans);letter-spacing:.01em;padding:0 6px}
.brand small{display:block;font:400 12px/1.5 var(--sans);color:var(--muted);margin-top:3px;letter-spacing:0}

.searchbox{position:relative}
.searchbox input{
  width:100%;padding:9px 34px 9px 32px;font:400 14px/1.4 var(--sans);
  color:var(--ink);background:var(--input-bg);border:1px solid var(--rule);border-radius:5px;
  transition:border-color .12s,box-shadow .12s;
}
.searchbox input::placeholder{color:var(--placeholder)}
.searchbox input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox .mag{position:absolute;left:10px;top:9px;width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8}
.searchbox kbd{
  position:absolute;right:7px;top:7px;font:400 11px/1 var(--mono);color:var(--muted);
  background:var(--code-bg);border:1px solid var(--rule);border-radius:3px;padding:3px 4px;
}
.searchbox input:focus + kbd{opacity:0}

.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{
  display:inline-flex;align-items:center;gap:5px;
  font:400 12.5px/1 var(--sans);color:var(--muted);background:none;
  border:1px solid var(--rule);border-radius:999px;padding:5px 10px;cursor:pointer;
  transition:color .12s,border-color .12s,background .12s;
}
.chips button:hover{color:var(--ink);border-color:var(--muted)}
.chips button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chips button .c{font:400 11px/1 var(--mono);opacity:.55;font-variant-numeric:tabular-nums}

nav{display:flex;flex-direction:column;gap:1px}
nav a{
  display:flex;gap:10px;align-items:baseline;
  padding:6px 8px;border-radius:4px;text-decoration:none;color:var(--nav-fg);
  font-size:14px;border-left:2px solid transparent;margin-left:-2px;
}
nav a .n{font:400 11px/1 var(--mono);color:var(--nav-n);min-width:14px;padding-top:3px}
nav a:hover{background:var(--rule-soft);color:var(--ink)}
nav a.on{color:var(--accent);background:var(--accent-soft);border-left-color:var(--accent);font-weight:500}
nav a.on .n{color:var(--accent)}
nav .sub{padding-left:24px;font-size:13px;color:var(--muted)}

.railfoot{
  margin-top:auto;padding:14px 6px 0;border-top:1px solid var(--rule);
  font-size:12.5px;line-height:1.85;color:var(--muted);
}
.railfoot b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.themebtn{
  display:flex;align-items:center;gap:7px;width:100%;margin-top:10px;
  font:400 13px/1 var(--sans);color:var(--muted);background:none;border:0;
  padding:7px 8px;border-radius:4px;cursor:pointer;text-align:left;
}
.themebtn:hover{background:var(--rule-soft);color:var(--ink)}
.themebtn svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6}

/* ---------- 主区 ---------- */
.main{padding:52px 60px 140px;max-width:1160px}
.lede{max-width:44em;color:var(--muted);font-size:15px;margin:0 0 6px}
.lede b{color:var(--ink);font-weight:600}

h2{
  font:600 27px/1.4 var(--serif);margin:0 0 4px;
  padding-top:44px;scroll-margin-top:24px;display:flex;align-items:baseline;gap:13px;
}
h2 .num{font:400 12px/1 var(--mono);color:var(--accent);letter-spacing:.08em;flex:none}
section:first-of-type h2{padding-top:8px}
h3{
  font:600 16.5px/1.6 var(--sans);margin:32px 0 8px;
  padding-bottom:6px;border-bottom:1px solid var(--rule);scroll-margin-top:24px;
}
p{max-width:44em;margin:10px 0}
.hint{max-width:44em;color:var(--muted);font-size:14.5px;margin:10px 0}

code,.id{
  font-family:var(--mono);font-size:.875em;background:var(--code-bg);
  padding:.12em .42em;border-radius:3px;color:var(--code-fg);
}
.id{cursor:copy;border-bottom:1px solid var(--id-line)}
.id:hover{background:var(--id-hover)}
.id:active{background:var(--accent-soft)}

table{width:100%;border-collapse:collapse;margin:12px 0 8px;font-size:14.5px}
th{
  text-align:left;font:600 12.5px/1.5 var(--sans);color:var(--muted);
  border-bottom:1px solid var(--ink);padding:6px 16px 7px 0;white-space:nowrap;
}
td{padding:9px 16px 9px 0;border-bottom:1px solid var(--rule-soft);vertical-align:top}
td:last-child,th:last-child{padding-right:0}
tbody tr:hover{background:var(--hover-bg)}
td.name{font-weight:500}
td.wide{color:var(--muted)}

ul.plain{list-style:none;padding:0;margin:10px 0;max-width:44em}
ul.plain li{position:relative;padding-left:16px;margin:5px 0;font-size:15px}
ul.plain li::before{content:"";position:absolute;left:2px;top:.68em;width:4px;height:4px;border-radius:50%;background:var(--dot)}

.note{
  max-width:44em;background:var(--note-bg);border-left:2px solid var(--accent);
  padding:11px 16px;margin:16px 0;font-size:14.5px;color:var(--note-fg);border-radius:0 4px 4px 0;
}
.note b{color:var(--ink)}

/* ---------- 搜索结果 ---------- */
#results{display:none}
#results .rsum{font-size:14px;color:var(--muted);margin:0 0 18px}
#results .rsum b{color:var(--ink)}
.rlist{list-style:none;padding:0;margin:0;max-width:60em}
.rlist li{margin:0 0 1px}
.rlist button{
  display:block;width:100%;text-align:left;background:none;border:0;border-radius:4px;
  padding:9px 11px;font:inherit;color:inherit;cursor:pointer;
}
.rlist button:hover,.rlist button.cursor{background:var(--accent-soft)}
.rlist .rsec{font:400 11px/1 var(--mono);color:var(--accent);letter-spacing:.06em}
.rlist .rtxt{font-size:14.5px;margin-top:4px;color:var(--nav-fg)}
.rempty{color:var(--muted);font-size:14.5px;max-width:44em}
mark{background:var(--mark);color:inherit;padding:.05em .1em;border-radius:2px}

/* ---------- 命中闪烁 ---------- */
@keyframes flash{from{background:var(--mark)}to{background:transparent}}
.flash{animation:flash 1.1s ease-out}

/* ---------- 响应式 ---------- */
.railtoggle{
  display:none;position:fixed;right:16px;bottom:16px;z-index:30;
  background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;
  padding:11px 17px;font:500 14px/1 var(--sans);cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  .rail{
    position:fixed;inset:0 auto 0 0;width:282px;z-index:20;
    background:var(--paper);transform:translateX(-100%);transition:transform .18s ease;
    box-shadow:0 0 0 100vmax rgba(0,0,0,.25);
  }
  .rail.open{transform:none}
  .main{padding:34px 22px 120px}
  .railtoggle{display:block}
  h2{font-size:23px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

        <span id="themelabel">深色</span>
      </button>
    </div>
  </aside>

  <main class="main">

</div>

<button class="railtoggle" id="railtoggle" aria-expanded="false">目录</button>

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 把标识符/命令渲染成可点击复制的 code */
function idify(text){
  return esc(text)
    .replace(/`([^`]+)`/g, '<span class="id" data-copy="$1" title="点击复制">$1</span>')
    .replace(/\/(commit-push-pr|commit|clean_gone|review-pr|code-review|simplify|security-review|fewer-permission-prompts|loop|update-config|keybindings-help|mcp)\b/g,
             '<span class="id" data-copy="$&" title="点击复制">$&</span>')
    .replace(/\b([a-z][a-z0-9]*(?:_[a-z0-9]+)+)\b(?![^<]*<\/span>)/g,
             '<span class="id" data-copy="$1" title="点击复制">$1</span>')
    .replace(/\b([a-z]+(?:-[a-z0-9]+){1,})(?![^<]*<\/span>)/g,
             '<span class="id" data-copy="$1" title="点击复制">$1</span>');
}

function renderBlock(b){
  if(b.t === "h3") return `<h3>${esc(b.x)}</h3>`;
  if(b.t === "p")  return `<p>${idify(b.x)}</p>`;
  if(b.t === "ul") return `<ul class="plain">${b.items.map(i => `<li>${idify(i)}</li>`).join("")}</ul>`;
  if(b.t === "note") return `<div class="note">${idify(b.x)}</div>`;
  if(b.t === "agents") return `<div id="agentdir"></div>`;
  if(b.t === "table"){
    const head = b.head.map(h => `<th>${esc(h)}</th>`).join("");
    const rows = b.rows.map(r => {
      const tds = r.map((c,i) => {
        const cls = i === 0 ? "name" : (i === r.length - 1 && r.length > 2 ? "wide" : "");
        return `<td class="${cls}">${idify(c)}</td>`;
      }).join("");
      return `<tr>${tds}</tr>`;
    }).join("");
    return `<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  }
  return "";
}

(function renderAgents(){
  const host = document.getElementById("agentdir");
  if(!host) return;

  const groups = new Map();
  AGENTS.forEach(([file, cn, desc]) => {
    const p = file.split("-")[0];

  const big = [...groups.entries()].filter(([,v]) => v.length >= 3).sort((a,b) => b[1].length - a[1].length);

function indexNode(el, cat, secTitle, text){
  if(!text || !text.trim()) return;
  INDEX.push({el, cat, secTitle, text:text.replace(/\s+/g," ").trim()});
}

doc.querySelectorAll("section").forEach(sec => {
  const h2 = sec.querySelector("h2");
  const secTitle = h2 ? h2.textContent.trim() : "";
  sec.querySelectorAll("h2,h3,tr,li").forEach(el => {
    if(el.tagName === "TR"){
      const tds = [...el.querySelectorAll("td")];
      if(!tds.length) return;
      indexNode(el, sec.id, secTitle, tds.map(t => t.textContent).join(" ｜ "));
    } else if(el.tagName === "LI"){
      indexNode(el, sec.id, secTitle, el.textContent);
    } else if(el.tagName === "H3"){
      indexNode(el, sec.id, secTitle, el.textContent);
    }
  });
});

let matches = [];

function hl(text, q){
  const e = esc(text);
  if(!q) return e;
  const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
  return e.replace(re, "<mark>$1</mark>");
}

function search(qRaw){
  const q = qRaw.trim().toLowerCase();
  if(!q && !activeCat) return closeResults();

  matches = INDEX.filter(r =>
    (!activeCat || r.cat === activeCat) &&
    (!q || r.text.toLowerCase().includes(q))
  );
  cursor = -1;

  doc.style.display = "none";
  resEl.style.display = "block";
  window.scrollTo(0,0);

  if(!matches.length){
    resEl.innerHTML = `<p class="rsum">没有匹配的内容。</p>
      <p class="rempty">换个词试试，或点「全部」取消分类筛选。常见入口：提交、浏览器、测试、小红书、PDF、搜索词、绩效。</p>`;
    return;
  }

  const scope = (activeCat ? `，限「${esc(CAT_LABEL[activeCat])}」` : "")
              + (q ? `，匹配「${esc(qRaw)}」` : "");

  resEl.innerHTML = `<p class="rsum">共 <b>${matches.length}</b> 条${scope}　<span style="font-size:13px">↑ ↓ 选择，Enter 跳转</span></p>
    <ul class="rlist" id="rlist">${matches.map((m,i) => `
      <li><button data-i="${i}">
        <span class="rsec">${esc(m.secTitle)}</span>
        <div class="rtxt">${hl(m.text, qRaw)}</div>
      </button></li>`).join("")}</ul>`;
}

function closeResults(){
  resEl.style.display = "none";
  resEl.innerHTML = "";
  doc.style.display = "";
  matches = [];
  cursor = -1;
  syncNav();
}

function moveCursor(d){
  if(!matches.length) return;
  cursor = Math.max(0, Math.min(matches.length - 1, cursor + d));
  const btns = resEl.querySelectorAll(".rlist button");
  btns.forEach((b,i) => b.classList.toggle("cursor", i === cursor));
  if(btns[cursor]) btns[cursor].scrollIntoView({block:"nearest"});
}

function jump(i){
  const m = matches[i];
  if(!m) return;
  qEl.value = "";
  closeResults();
  requestAnimationFrame(() => {
    m.el.scrollIntoView({block:"center", behavior:"smooth"});
    m.el.classList.add("flash");
    setTimeout(() => m.el.classList.remove("flash"), 1200);
  });
}

qEl.addEventListener("input", e => search(e.target.value));
qEl.addEventListener("keydown", e => {
  if(e.key === "ArrowDown"){ e.preventDefault(); moveCursor(1); }
  else if(e.key === "ArrowUp"){ e.preventDefault(); moveCursor(-1); }
  else if(e.key === "Enter"){ e.preventDefault(); jump(cursor < 0 ? 0 : cursor); }
  else if(e.key === "Escape"){ qEl.value = ""; resetChips(); closeResults(); qEl.blur(); }
});
resEl.addEventListener("click", e => {
  const b = e.target.closest(".rlist button");
  if(b) jump(Number(b.dataset.i));
});
document.addEventListener("keydown", e => {
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){
    e.preventDefault(); rail.classList.add("open"); qEl.focus(); qEl.select();
  }
});

/* ============================================================
   复制标识符
   ============================================================ */

doc.addEventListener("click", e => {
  const t = e.target.closest(".id");
  if(!t) return;
  const v = t.dataset.copy;
  navigator.clipboard.writeText(v).then(() => {
    t.classList.add("flash");
    setTimeout(() => t.classList.remove("flash"), 900);
  }).catch(() => {});
});

/* ============================================================
   导航高亮 + 移动端抽屉
   ============================================================ */

const navLinks = [...nav.querySelectorAll("a")];
function syncNav(){
  let cur = SECTIONS[0].id;
  for(const s of SECTIONS){
    const el = document.getElementById(s.id);
    if(el && el.getBoundingClientRect().top <= 90) cur = s.id;
  }
  navLinks.forEach(a => a.classList.toggle("on", a.dataset.sec === cur));
}
let ticking = false;
window.addEventListener("scroll", () => {
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(() => { if(doc.style.display !== "none") syncNav(); ticking = false; });
}, {passive:true});
syncNav();

navLinks.forEach(a => a.addEventListener("click", () => rail.classList.remove("open")));

const toggle = document.getElementById("railtoggle");
toggle.addEventListener("click", () => {
  const open = rail.classList.toggle("open");
  toggle.setAttribute("aria-expanded", String(open));
});
document.addEventListener("click", e => {
  if(window.innerWidth > 900) return;
  if(!rail.classList.contains("open")) return;
  if(rail.contains(e.target) || toggle.contains(e.target)) return;
  rail.classList.remove("open");
});

/* ============================================================
   深浅色
   ============================================================ */

const themebtn = document.getElementById("themebtn");
const themelabel = document.getElementById("themelabel");

function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  themelabel.textContent = t === "dark" ? "浅色" : "深色";
}
themebtn.addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  try{ localStorage.setItem("cccap-theme", next); }catch(e){}
});
applyTheme(document.documentElement.getAttribute("data-theme") || "light");
</script>
